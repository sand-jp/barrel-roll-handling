plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	mods {
		"barrel_roll_handling" {
			sourceSet sourceSets.main
		}
	}
}


// The game's screens changed in 26.2: what differs is in a folder for each, and the older game gets a jar of its own
def olderGame = project.minecraft_version.startsWith('26.1')
sourceSets.main.java.srcDir(olderGame ? 'src/main/mc26_1/java' : 'src/main/mc26_2/java')
if (olderGame) {
	version = "${project.version}+26.1"
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases'
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	compileOnly('com.terraformersmc:modmenu:21.0.0') {
		transitive = false
	}
	// Only their APIs, and only when they are there: Do a Barrel Roll for the flight, YetAnotherConfigLib for its screen
	compileOnly "maven.modrinth:do-a-barrel-roll:${olderGame ? '3.8.4+26.1-fabric' : '3.8.5+26.3-fabric'}"
	compileOnly "maven.modrinth:yacl:${olderGame ? '3.9.7+26.1-fabric' : '3.9.7+26.3-fabric'}"
}

processResources {
	def version = project.version
	def games = olderGame ? '>=26.1 <26.2' : '>=26.2 <26.4'
	inputs.property "version", version
	inputs.property "games", games

	filesMatching("fabric.mod.json") {
		expand "version": version, "games": games
	}
}

jar {
	def name = project.name
	from("LICENSE") {
		rename { "${it}_${name}" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
